name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows is the only platform this config is ever used on, so it is the job
  # allowed to fail the build.
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python ci/run_all.py

  # Answered "are the hook tests portable?" empirically (todo 454): yes, once
  # the two Windows-only backslash-path cases in test_todo_duplicate_guard.py
  # skip on POSIX. Kept running here as a standing rot-detection signal.
  portability-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python ci/run_all.py
